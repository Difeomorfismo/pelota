name: Crear juego para macOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Pygame y PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pygame pyinstaller

      - name: Crear aplicación
        run: |
          pyinstaller --windowed --name "Neon Rebound" neon_rebound.py

      - name: Comprimir aplicación
        run: |
          cd dist
          zip -r "Neon-Rebound-macOS.zip" "Neon Rebound.app"

      - name: Guardar aplicación
        uses: actions/upload-artifact@v4
        with:
          name: Neon-Rebound-macOS
          path: dist/Neon-Rebound-macOS.zip
